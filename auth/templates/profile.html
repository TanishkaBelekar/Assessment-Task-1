<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Edit Profile</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fffbea;
      margin: 40px auto;
      padding: 20px;
      color: #333;
      display: flex;
      justify-content: center;
    }

    .container {
      background-color: #e0e0e0; 
      padding: 25px 30px;
      border-radius: 6px;
      max-width: 400px;
      width: 100%;
      box-sizing: border-box;
      box-shadow: 1px 1px 5px rgba(0,0,0,0.1);
    }

    h2 {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input[type="text"],
    input[type="email"] {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 3px;
    }

    button {
      margin-top: 20px;
      padding: 10px;
      width: 100%;
      background-color: #28a745; 
      color: white;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }

    button:hover {
      background-color: #1e7e34;  
    }

    a {
      display: block;
      margin-top: 15px;
      text-align: center;
      color: #28a745;  
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .error-message {
      color: red;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Edit Profile</h2>

    {% if error %}
      <div class="error-message">{{ error }}</div>
    {% endif %}

    <form method="POST" novalidate>
      <label for="name">Name</label>
      <input id="name" name="name" type="text" value="{{ user.name }}" required>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" value="{{ user.email }}" required>

      <button type="submit">Update Profile</button>
    </form>

    <a href="/dashboard">Back to Dashboard</a>
  </div>
</body>
</html>
