<!DOCTYPE html>
<html lang="en">
<head>
  <title>User Dashboard</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-sm-15 text-center">
            <h1>User Dashboard</h1>
            <h3>Welcome, {{ name }}!</h3>
            <div class="btn-group-vertical" role="group" aria-label="User actions">
            <a href="/profile" class="btn btn-primary btn-lg" style="background-color:#8ab92d ; margin-bottom: 15px;">Edit Profile</a>
            <a href="/change_password" class="btn btn-warning btn-lg" style="background-color:#CD853F ; margin-bottom: 15px;">Change Password</a>
            <a href="/logout" class="btn btn-danger btn-lg">Logout</a>
</div>
        </div>
    </div>
</div>

</body>
</html>
